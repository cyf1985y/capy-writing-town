const partsPool = () => [...new Set([...charsOf(saved.passedTaskIds), ...charsOf(demoIds)])];
function openParts(focus = null) {
  if (!partsGame || panel.isOpen() || partsGame.isOpen() || dictation?.isOpen()) return false;
  const words = Object.fromEntries([...loaded.writingTasks.values()].map(t => [t.char, t.hint_word])), ok = partsGame.open(partsPool(), words, focus);
  if (!ok) setStatus('再多學幾個字，就能玩部件小偵探囉！'); return ok;
}
// v42 聽寫小考（先做康軒一上）：學過 5 個字以上才出現；一次 5 題，先拼注音再默寫國字；不動寫字存檔，只記「要再練的字」
const dictation = new Dictation({ voice, sound, log, storageKey: DICT_KEY,
  dataBaseFor: ch => TW_CHARS.has(ch) ? './vendor-v2/hanzi-writer/data-tw/' : './vendor-v2/hanzi-writer/data/', wordZhuyin: w => ZY[w]?.zhuyin ?? null,
  onOpen: () => { lobby.pause('dictation'); $('#startBtn').disabled = true; },
  onClose: r => { lobby.resume('dictation'); $('#startBtn').disabled = false; diag.dictation = r; if (r.finished) townFx?.cheer?.(!r.weak.length); /* v46：考完回小鎮，朋友一起跳、噴彩帶 */ setStatus((r.finished ? `👂 聽寫小考完成！${r.weak.length ? '要再練：' + r.weak.join('、') + '。' : '全部答對！'}` : `👂 聽寫小考寫了 ${r.done}／${r.total} 題`) + nextLabel()); } }); // v42：康軒、南一都有聽寫小考
const dictPool = () => { const seen = new Set(); return saved.passedTaskIds.map(id => loaded.writingTasks.get(id)).filter(t => t?.char && t.zhuyin && !seen.has(t.char) && seen.add(t.char)).map(t => ({ char: t.char, zhuyin: t.zhuyin, word: t.hint_word })); };
function updateDictBtn() { $('#dictBtn').hidden = !dictation || dictPool().length < DICTATION_N; }
$('#dictBtn').addEventListener('click', () => {
  if (panel.isOpen() || partsGame?.isOpen() || dictation?.isOpen() || shop?.isOpen() || parent.isOpen() || opening) return; sound.unlock();
  if (!dictation.open(dictPool())) setStatus('再多學幾個字，就能玩聽寫小考囉！');
});

// 4) 入口：DOM 大按鈕。滑鼠／觸控／鍵盤（Enter、Space 由 button 原生處理）都走同一個 click；panel.start() 已開啟時直接忽略。
let opening = false;
async function startWriting() {
  if (opening || panel.isOpen()) { log('start ignored (already open)'); return; }
  opening = true;
  try {
    const task = loaded.writingTasks.get(demoIds[queueIndex]);
    const attemptId = crypto.randomUUID();
    const ok = await panel.start(task, { attemptId, index: queueIndex, total: demoIds.length });
    if (ok) await store.markInProgress(task, attemptId);
    log(`start ${task.id} -> ${ok}`);
  } finally { opening = false; }
}
$('#startBtn').addEventListener('click', () => { sound.unlock(); startWriting(); });
$('#startBtn').addEventListener('pointerdown', e => e.preventDefault()); // 避免按鈕按壓把 pointerdown 傳給 canvas 後的焦點抖動
// 禁止雙擊與選取；觸控上 click 只會來一次，不另外處理 touchstart 以免重複開啟
$('#startBtn').addEventListener('dblclick', e => e.preventDefault());

// 暖機：等第一幀真的畫出來（shader 編譯完成）再亮按鈕，避免孩子一按就卡
await new Promise(res => { const r0 = lobby.renderCount; const tick = () => (lobby.renderCount > r0 ? res() : requestAnimationFrame(tick)); tick(); });
diag.loadMs.firstFrame = Math.round(performance.now() - t0);
$('#startBtn').textContent = contract.entry.label; $('#startBtn').disabled = false;
fitStage(); townFx.placePins(); /* v7：章節列、按鈕文字都就位後再量一次版面 */
$('#albumBtn').disabled = false; updateAlbumBtn(); updateReviewBtn(); updatePartsBtn(); updateDictBtn(); updateShopBtn(); // v8 修正：v7 這行被上一行的 // 註解吃掉，圖鑑鈕一直是停用
setStatus(nextLabel());
diag.loadMs.ready = Math.round(performance.now() - t0);
// 測試自動跑（?test=1&autoplay=1）：用合成筆跡依序寫完 demo3 三字，供 headless 截圖與煙霧測試；不是真人操作
if (qs.get('test') === '1' && qs.get('autoplay') === '1') {
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  // v12：等慶祝動畫播完（開始鈕恢復）、面板字形載好再寫；v11 以前固定等 900ms，第 1 課第一個字的獎勵動畫比較長，第二個字就會撲空
  const until = async (f, ms = 30000) => { const t = performance.now(); while (!f()) { if (performance.now() - t > ms) throw new Error('autoplay timeout'); await sleep(100); } };
  (async () => { for (let i = 0; i < demoIds.length; i++) { await until(() => !$('#startBtn').disabled && !panel.isOpen()); $('#startBtn').click(); await until(() => panel.state?.writer); await sleep(400); await window.__wpDrawAll({ jitter: 6 }); await until(() => document.querySelector('button[data-act="next"]:not([hidden])')); document.querySelector('button[data-act="next"]').click(); } log('autoplay done'); })().catch(e => log('autoplay failed: ' + e));
}
// 載入後靜置 2 秒量一次 draw calls 與 RAF／render 頻率
setTimeout(async () => { diag.measures.push({ when: 'lobby_idle', ...(await lobby.measure(2000)) }); log('measured lobby_idle'); }, 500);
</script>

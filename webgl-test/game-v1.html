}

}

details{margin-top:8px}pre{white-space:pre-wrap;font-size:12px;background:#fff;border-radius:8px;padding:8px;max-height:220px;overflow:auto}

<script type="module">
import { loadContract, describeLoadError } from './game/content.js?v=51';

import { BossRun, pickBossChars, pickQuestionFor } from './game/boss.js?v=51';
import { ShopPanel } from './game/shop-ui.js?v=51';
import { BOOKS, currentBook, saveBook, profileFor, lessonKeyFor } from './game/books.js?v=51';
import { currentSkin, saveSkin, loadSkin, applySkin, readySkins } from './game/skin.js?v=51';
const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);
// v19 課本版本：每個版本一份契約；profileId 加版本後綴，進度、星星、獎勵、配件都分開（康軒沒有後綴，舊存檔照舊）
const BOOK = currentBook(qs), LESSON_KEY = lessonKeyFor(BOOK);
const PROFILE_ID = profileFor(qs.get('profile') || 'local-child-1', BOOK); // 第一版單一本機 profile，無選擇 UI
// 章節＝契約 v2 的 lesson_N 模式；網址 ?lesson=N 優先，其次上次選的（localStorage），最後契約預設
let MODE = 'demo3';
const t0 = performance.now();
const diag = { errors: [], events: [], loadMs: {}, measures: [] };
window.addEventListener('error', e => diag.errors.push(e.message)); window.addEventListener('unhandledrejection', e => diag.errors.push(String(e.reason)));
const setStatus = (m, err = false) => { $('#status').textContent = m; $('#status').className = err ? 'err' : ''; };
const log = m => { diag.events.push({ t: Math.round(performance.now()), m }); $('#diag').textContent = JSON.stringify(diag, null, 1); };

// 1) 契約與題庫（SHA 不符即拒載，按鈕不啟用）
let loaded;
try { loaded = await loadContract('../', BOOKS[BOOK].contract); diag.loadMs.contract = Math.round(performance.now() - t0); }
catch (err) { setStatus(describeLoadError(err), true); $('#startBtn').textContent = '無法開始'; throw err; }
const { contract } = loaded;
// v44 主題（外表）：圖片準備好的主題才套用，否則維持預設的甜點樂園。進度共用。
const SKIN_ID = currentSkin(qs), SKIN = await loadSkin(SKIN_ID); if (SKIN) { applySkin(contract, SKIN); document.title = SKIN.title ?? document.title; } diag.skin = SKIN ? SKIN.id : 'sweet';
const RV = { icon: '🍰', name: '甜點店補貨', cont: '繼續補貨', ...SKIN?.review }; // v44 每日複習的名字跟著主題換
{ const want = qs.get('lesson') != null ? 'lesson_' + qs.get('lesson') : (localStorage.getItem(LESSON_KEY) || contract.chapters.defaultMode); MODE = contract.modes[want] ? want : contract.chapters.defaultMode; }
let demoIds = contract.modes[MODE].writingTaskIds;

// 2) 大廳：2D 插畫小鎮（v49 起只有這一種）
const LOBBY2D = true; diag.lobby = '2d'; /* v49：拿掉 3D 小鎮（?lobby=3d），只剩 2D 插畫大廳；3D 程式檔還在 game/ 但不再載入 */
const STAGE_AR = LOBBY2D ? contract.art2d.size[1] / contract.art2d.size[0] : 941 / 1672; // 高／寬
let town;
try {
  town = await new Town2D({ contract, stage: $('#stage'), onStatus: setStatus }).load();
  diag.loadMs.town = Math.round(performance.now() - t0);
} catch (err) { setStatus('小鎮插畫載入失敗：' + err.message, true); throw err; }
for (const [k, v] of Object.entries(contract.theme.ui ?? {})) document.documentElement.style.setProperty('--ui-' + k, v); /* v49：原本 theme.js 的 applyUiColors，搬進來免得載入 3D 程式 */ document.title = contract.theme.title; $('#gameTitle').textContent = contract.theme.title;
const lobby = new Lobby2D(town); lobby.start();
// v3：寬度貼齊版面；v7：平板／桌機（寬 ≥ 600）再依螢幕高度限制，讓開始鈕、狀態列、字卡列都在同一頁
const PHONE_LAND = matchMedia('(orientation: landscape) and (max-height: 560px)'); // v47：手機橫放（CSS 同一條件：地圖在左、功能欄在右）
const fitStage = () => {
  const st = $('#stage'); let w = Math.min(1600, st.clientWidth);
  if (LOBBY2D && PHONE_LAND.matches) { w = Math.min(w, Math.floor((innerHeight - st.getBoundingClientRect().top - 6) / STAGE_AR)); }
  else if (innerWidth >= 600) {
    const top = st.getBoundingClientRect().top, below = $('#done').getBoundingClientRect().bottom - st.getBoundingClientRect().bottom + 14;
    const wByH = Math.floor((innerHeight - top - below) / STAGE_AR);
    if (wByH >= 520) w = Math.min(w, wByH);
  }
  town.resize(w); diag.stageFit = { width: w, height: Math.round(w * STAGE_AR), viewport: [innerWidth, innerHeight] };
};
fitStage();
window.addEventListener('resize', () => { fitStage(); lobby.requestFrame(); townFx?.placePins(); });
// v47：轉向後 iOS Safari 的 innerHeight 有時晚一點才更新，再量一次
addEventListener('orientationchange', () => setTimeout(() => { fitStage(); lobby.requestFrame(); townFx?.placePins(); }, 350));
// v47：直放提示。「直的也可以玩」＝這次開著就不再出現（下次打開遊戲會再提醒）
{ const g = $('#rotateGate'); let ok = false; try { ok = sessionStorage.getItem('capy_rotate_ok') === '1'; } catch { /* 私密模式 */ }
  if (ok) document.body.classList.add('rotate-ok');
  if (LOBBY2D) { const im = g.querySelector('img'); im.src = town.url(town.chars.values().next().value?.sprite + '_wave'); im.hidden = false; g.querySelector('.rg-phone').hidden = true; }
  const hint = $('#rotateHint'); hint.hidden = false;
  hint.addEventListener('click', () => { document.body.classList.remove('rotate-ok'); try { sessionStorage.removeItem('capy_rotate_ok'); } catch { /* ignore */ } log('rotate hint: show gate'); });
  g.querySelector('[data-act=stay]').addEventListener('click', () => { document.body.classList.add('rotate-ok'); try { sessionStorage.setItem('capy_rotate_ok', '1'); } catch { /* ignore */ } log('rotate gate: stay portrait'); }); }
let townFx = null;
const sound = new Sound();
const voice = new Voice(sound); // v4：唸字（瀏覽器內建語音）
const showMute = () => { if (LOBBY2D) $('#muteBtn').innerHTML = `<img alt="" src="${town.url(sound.muted ? 'btn_mute' : 'btn_sound')}">`; else $('#muteBtn').textContent = sound.muted ? '🔇' : '🔊'; };
showMute(); if (LOBBY2D) { document.body.classList.add('lobby2d'); fitStage(); /* v47：手機橫放的格線版面要有 lobby2d 才生效，重新量地圖 */ $('#albumBtn').innerHTML = `<img alt="" src="${town.url('btn_album')}">圖鑑`; }
$('#muteBtn').addEventListener('click', () => { sound.unlock(); sound.setMuted(!sound.muted); showMute(); if (!sound.muted) sound.stroke(2); });
diag.inventory = town.inventory;
diag.navigation = performance.getEntriesByType('navigation')[0]?.toJSON?.() ?? null;

    const attemptId = crypto.randomUUID();
    const ok = await panel.start(task, { attemptId, index: queueIndex, total: demoIds.length });
    if (ok) await store.markInProgress(task, attemptId);
    log(`start ${task.id} -> ${ok}`);
  } finally { opening = false; }
}
$('#startBtn').addEventListener('click', () => { sound.unlock(); startWriting(); });
$('#startBtn').addEventListener('pointerdown', e => e.preventDefault()); // 避免按鈕按壓把 pointerdown 傳給 canvas 後的焦點抖動
// 禁止雙擊與選取；觸控上 click 只會來一次，不另外處理 touchstart 以免重複開啟
$('#startBtn').addEventListener('dblclick', e => e.preventDefault());

// 暖機：等第一幀真的畫出來（shader 編譯完成）再亮按鈕，避免孩子一按就卡
await new Promise(res => { const r0 = lobby.renderCount; const tick = () => (lobby.renderCount > r0 ? res() : requestAnimationFrame(tick)); tick(); });
diag.loadMs.firstFrame = Math.round(performance.now() - t0);
$('#startBtn').textContent = contract.entry.label; $('#startBtn').disabled = false;
fitStage(); townFx.placePins(); /* v7：章節列、按鈕文字都就位後再量一次版面 */
$('#albumBtn').disabled = false; updateAlbumBtn(); updateReviewBtn(); updatePartsBtn(); updateDictBtn(); updateShopBtn(); // v8 修正：v7 這行被上一行的 // 註解吃掉，圖鑑鈕一直是停用
setStatus(nextLabel());
diag.loadMs.ready = Math.round(performance.now() - t0);
checkMastery(); // v50：舊存檔已經全三星的課，在這裡慶祝一次
// 測試自動跑（?test=1&autoplay=1）：用合成筆跡依序寫完 demo3 三字，供 headless 截圖與煙霧測試；不是真人操作
if (qs.get('test') === '1' && qs.get('autoplay') === '1') {
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  // v12：等慶祝動畫播完（開始鈕恢復）、面板字形載好再寫；v11 以前固定等 900ms，第 1 課第一個字的獎勵動畫比較長，第二個字就會撲空
  const until = async (f, ms = 30000) => { const t = performance.now(); while (!f()) { if (performance.now() - t > ms) throw new Error('autoplay timeout'); await sleep(100); } };
  (async () => { for (let i = 0; i < demoIds.length; i++) { await until(() => !$('#startBtn').disabled && !panel.isOpen()); $('#startBtn').click(); await until(() => panel.state?.writer); await sleep(400); await window.__wpDrawAll({ jitter: 6 }); await until(() => document.querySelector('button[data-act="next"]:not([hidden])')); document.querySelector('button[data-act="next"]').click(); } log('autoplay done'); })().catch(e => log('autoplay failed: ' + e));
}
// 載入後靜置 2 秒量一次 draw calls 與 RAF／render 頻率
setTimeout(async () => { diag.measures.push({ when: 'lobby_idle', ...(await lobby.measure(2000)) }); log('measured lobby_idle'); }, 500);
</script>
